name: harness

# Fast, focused gate for the experiment harness (preflight token/launch enforcement
# + dashboard pipeline). Deliberately separate from `tests.yml`:
#   - it installs only the lightweight deps the harness smoke tests actually need
#     (pytest + brian2 + matplotlib — the latter two only because tests/conftest.py
#     imports them), NOT the full `.[dev]` set (torch/nbmake/sphinx/notebooks), so a
#     packaging hiccup or a flaky tutorial can't mask whether the gate is intact;
#   - it runs only tests/test_harness_smoke.py, which includes the coverage guard
#     asserting every training entrypoint calls validate_preflight.
on:
  push:
    branches: [master, modeling-dev]
  pull_request:
    branches: [master, modeling-dev]
  workflow_dispatch:

jobs:
  harness:
    name: harness smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The harness modules are pure-stdlib and the test puts the repo root on
      # sys.path itself, so we need nothing but pytest — no package install (bypasses
      # the broken `.[dev]` resolution), and no brian2/matplotlib/numpy (which only
      # come in via tests/conftest.py and clash on numpy 2.x).
      - name: Install pytest
        run: pip install pytest

      - name: Run harness smoke tests
        # --noconftest skips tests/conftest.py (its top-level `import brian2.only`),
        # which the harness tests don't use. addopts="" drops the repo's --nbmake.
        run: pytest tests/test_harness_smoke.py --noconftest -o addopts="" -p no:cacheprovider -q
